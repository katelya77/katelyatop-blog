<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Katelya cobalt star garden</title>
  <desc id="desc">Original programmatic cobalt nightscape with gold stars, rolling cyan strokes and cypress-like anchors.</desc>
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a42"/>
      <stop offset=".38" stop-color="#153d6f"/>
      <stop offset=".68" stop-color="#1d5f77"/>
      <stop offset="1" stop-color="#0b2e4e"/>
    </linearGradient>
    <radialGradient id="starGlow">
      <stop offset="0" stop-color="#fff8c2" stop-opacity="1"/>
      <stop offset=".25" stop-color="#f2c85b" stop-opacity=".86"/>
      <stop offset="1" stop-color="#f2c85b" stop-opacity="0"/>
    </radialGradient>
    <filter id="nightCanvas" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".014 .09" numOctaves="3" seed="72" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#nightSky)"/>

  <g fill="none" stroke-linecap="round" filter="url(#nightCanvas)">
    <path d="M-90 236 C190 24 476 68 642 222 S1044 392 1274 192 S1690 22 2020 190" stroke="#2f78a6" stroke-width="82" opacity=".62"/>
    <path d="M-34 324 C226 136 492 164 680 292 S1052 456 1328 286 S1712 146 1984 260" stroke="#72b7c2" stroke-width="28" opacity=".82"/>
    <path d="M4 404 C240 260 482 264 702 384 S1118 520 1396 378 S1744 270 1978 352" stroke="#9ad6d2" stroke-width="18" opacity=".68"/>
    <path d="M174 514 C384 382 594 404 788 514 S1168 642 1404 520 S1712 406 1870 470" stroke="#4b91ad" stroke-width="44" opacity=".64"/>
    <path d="M-30 706 C290 514 618 554 896 686 S1458 846 1990 616" stroke="#173e67" stroke-width="154" opacity=".88"/>
    <path d="M-60 934 C306 744 686 778 1020 894 S1518 1048 1992 846" stroke="#092641" stroke-width="190" opacity=".96"/>
  </g>

  <g fill="none" stroke-linecap="round" opacity=".9">
    <path d="M182 258 C268 164 370 164 460 236" stroke="#9bd9d4" stroke-width="14"/>
    <path d="M536 154 C664 42 804 70 886 184" stroke="#68aebe" stroke-width="22"/>
    <path d="M1042 214 C1166 84 1324 94 1424 218" stroke="#8fd0cf" stroke-width="18"/>
    <path d="M1440 344 C1560 230 1728 250 1832 366" stroke="#5e9fb4" stroke-width="20"/>
  </g>

  <g>
    <g opacity=".6" filter="url(#glow)">
      <circle cx="310" cy="176" r="58" fill="url(#starGlow)"/>
      <circle cx="760" cy="116" r="78" fill="url(#starGlow)"/>
      <circle cx="1280" cy="160" r="68" fill="url(#starGlow)"/>
      <circle cx="1632" cy="238" r="52" fill="url(#starGlow)"/>
    </g>
    <g fill="#f2c85b">
      <circle cx="310" cy="176" r="13"/>
      <circle cx="760" cy="116" r="17"/>
      <circle cx="1280" cy="160" r="15"/>
      <circle cx="1632" cy="238" r="12"/>
      <circle cx="1010" cy="96" r="8"/>
      <circle cx="520" cy="312" r="7"/>
      <circle cx="1504" cy="104" r="8"/>
    </g>
    <g fill="none" stroke="#fff1a8" stroke-linecap="round" opacity=".82">
      <circle cx="310" cy="176" r="31" stroke-width="8"/>
      <circle cx="760" cy="116" r="40" stroke-width="10"/>
      <circle cx="1280" cy="160" r="35" stroke-width="9"/>
      <path d="M306 128 V96 M306 256 V224 M258 176 H226 M394 176 H362" stroke-width="8"/>
      <path d="M760 50 V20 M760 212 V180 M690 116 H658 M862 116 H830" stroke-width="9"/>
    </g>
  </g>

  <g fill="#071d2f">
    <path d="M30 1080 C42 910 58 744 112 600 C152 494 208 426 236 326 C270 452 286 556 300 666 C316 806 320 936 330 1080Z"/>
    <path d="M1590 1080 C1602 904 1616 754 1650 624 C1686 488 1746 398 1774 286 C1810 420 1824 548 1830 664 C1840 824 1836 944 1848 1080Z"/>
  </g>
  <g fill="none" stroke="#174d4e" stroke-linecap="round" opacity=".78">
    <path d="M136 1006 C126 836 148 700 212 554" stroke-width="28"/>
    <path d="M1704 1006 C1694 838 1712 680 1770 516" stroke-width="32"/>
  </g>

  <g fill="none" stroke="#335f88" stroke-linecap="round" opacity=".72">
    <path d="M388 848 L388 742 M448 848 L448 706 M516 848 L516 760 M582 848 L582 724" stroke-width="34"/>
    <path d="M1326 850 L1326 738 M1392 850 L1392 700 M1460 850 L1460 752" stroke-width="38"/>
  </g>
  <g fill="#f2c85b" opacity=".74">
    <rect x="370" y="764" width="34" height="28" rx="4"/>
    <rect x="430" y="726" width="34" height="28" rx="4"/>
    <rect x="1308" y="758" width="36" height="30" rx="4"/>
    <rect x="1374" y="722" width="36" height="30" rx="4"/>
  </g>

  <ellipse cx="960" cy="510" rx="410" ry="250" fill="#e7f0d2" opacity=".07"/>
  <rect x="20" y="20" width="1880" height="1040" rx="44" fill="none" stroke="#f2c85b" stroke-opacity=".24" stroke-width="3"/>
</svg>
