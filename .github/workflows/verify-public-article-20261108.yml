name: One-time live article and K-Vault cover verification
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/verify-public-article-20261108.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify article content and public PNG readback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const page = 'https://blog.katelya.top/posts/cloudflare-pages-kvault-automated-media-security-boundaries/';
          const cover = 'https://media.katelya.top/file/r2:r2_1794115780208_7pgn22.png';
          let passed = false;
          for (let attempt=1; attempt<=18; attempt++) {
            let code = 'network-error';
            try {
              const res = await fetch(page, { headers: { 'User-Agent':'KatelyaBlog-Publish-Check/1.0' }, signal:AbortSignal.timeout(20000) });
              code = String(res.status);
              const html = await res.text();
              if (res.status === 200 && html.includes('Bot Fight Mode') && html.includes('K-Vault') && html.includes('同一个 Pages')) { passed=true; break; }
            } catch (error) { console.log('Transient response error: ' + error.name); }
            console.log('Article check attempt', attempt, 'HTTP', code, '- not ready');
            if (attempt<18) await new Promise(r=>setTimeout(r,15000));
          }
          if (!passed) throw new Error('Production article was not served with expected content');
          const res = await fetch(cover,{headers:{Range:'bytes=0-1023','User-Agent':'KatelyaBlog-Publish-Check/1.0'},signal:AbortSignal.timeout(20000)});
          const mime = (res.headers.get('content-type')||'').split(';')[0];
          const bytes = new Uint8Array(await res.arrayBuffer());
          const png = bytes.length>=8 && [137,80,78,71,13,10,26,10].every((n,i)=>bytes[i]===n);
          console.log('Cover HTTP',res.status,'MIME',mime,'PNG',png,'bytes',bytes.length);
          if (!res.ok || mime !== 'image/png' || !png) throw new Error('Production K-Vault cover failed readback');
          console.log('PUBLIC_ARTICLE_VERIFIED=yes');
          console.log('PUBLIC_ARTICLE_URL='+page);
          NODE
