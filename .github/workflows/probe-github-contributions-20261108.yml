name: Probe GitHub contribution-calendar access
on:
  push:
    branches: [master]
    paths: [".github/workflows/probe-github-contributions-20261108.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query official GitHub GraphQL calendar without exposing token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const now=new Date();
          const from=new Date(now.getTime()-365*86400000).toISOString();
          const query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount contributionLevel}}}totalCommitContributions totalPullRequestContributions totalIssueContributions totalPullRequestReviewContributions}}}';
          const res=await fetch('https://api.github.com/graphql',{method:'POST',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,'Content-Type':'application/json','User-Agent':'katelya-blog-build-probe'},body:JSON.stringify({query,variables:{login:'katelya77',from,to:now.toISOString()}})});
          const doc=await res.json();
          if(!res.ok||doc.errors?.length||!doc.data?.user)throw new Error('GraphQL unavailable: HTTP '+res.status+' '+JSON.stringify(doc.errors?.map(e=>e.type||e.message)?.slice(0,2)));
          const c=doc.data.user.contributionsCollection;
          const days=c.contributionCalendar.weeks.flatMap(x=>x.contributionDays);
          console.log(JSON.stringify({status:'ok',days:days.length,total:c.contributionCalendar.totalContributions,activeDays:days.filter(x=>x.contributionCount>0).length,commits:c.totalCommitContributions,prs:c.totalPullRequestContributions,issues:c.totalIssueContributions,reviews:c.totalPullRequestReviewContributions}));
          NODE
