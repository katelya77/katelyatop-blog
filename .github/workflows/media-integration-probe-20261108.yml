name: One-time K-Vault Edge Diagnostics

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/media-integration-probe-20261108.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'test media edge diagnostic v4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTP response without authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 15 --dump-header "$RUNNER_TEMP/headers" --output "$RUNNER_TEMP/body" https://pan.katelya.eu.org/api/v1/capabilities
          node - <<'NODE'
          const fs = require('node:fs');
          const headers = fs.readFileSync(process.env.RUNNER_TEMP + '/headers', 'utf8');
          const body = fs.readFileSync(process.env.RUNNER_TEMP + '/body', 'utf8');
          const title = /<title[^>]*>([^<]+)/i.exec(body)?.[1]?.trim().slice(0, 160) || '(not provided)';
          for (const line of headers.split(/\r?\n/)) {
            if (/^HTTP\/|^(server|cf-mitigated|cf-ray|content-type|x-blocked-by):/i.test(line.trim())) console.log(line.trim());
          }
          console.log('HTML title: ' + title);
          console.log('Looks like Cloudflare challenge: ' + (/Just a moment|Attention Required|cf-chl|challenge-platform/i.test(body) ? 'yes' : 'not established'));
          NODE
