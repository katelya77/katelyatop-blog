name: Legacy GitHub Pages Branch Deploy (Manual)

on:
  # Production deployment is handled by the Cloudflare Pages Git integration.
  # Keep this workflow only as an explicit manual fallback for the `pages` branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and deploy legacy pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          ENABLE_CONTENT_SYNC: false

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: dist
          clean: true
