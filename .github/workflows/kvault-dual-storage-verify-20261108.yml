name: Diagnose R2 URL Encoded Public Readback

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/kvault-dual-storage-verify-20261108.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Compare encoded and raw R2 URLs
        env:
          KVAULT_BASE_URL: https://media.katelya.top
          KVAULT_API_TOKEN: ${{ secrets.KVAULT_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://media.katelya.top';
          const id='r2:r2_1794114530431_ha0gwt.png';
          for (const name of ['encoded','literal']) {
            const url=base+'/file/'+(name==='encoded'?encodeURIComponent(id):id);
            const r=await fetch(url,{redirect:'manual',headers:{Range:'bytes=0-1023'}});
            console.log(name,'status',r.status,'type',r.headers.get('content-type'));
            if(!r.ok) console.log(name,'body',(await r.text()).slice(0,100)); else await r.body?.cancel();
          }
          const info=await fetch(base+'/api/v1/file/'+encodeURIComponent(id)+'/info',{headers:{Authorization:'Bearer '+process.env.KVAULT_API_TOKEN},redirect:'manual'});
          console.log('metadata status',info.status);
          if(info.ok) { const data=await info.json(); console.log('metadata exists',data.success===true,'storage',data?.file?.storage||data?.data?.file?.storage||'unknown'); } else await info.body?.cancel();
          NODE
