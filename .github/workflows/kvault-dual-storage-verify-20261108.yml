name: Verify K-Vault Compatible Client R2 and Telegram

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/kvault-dual-storage-verify-20261108.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/kvault-r2-url-normalization-20261108
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify R2 upload and valid public readback
        env:
          KVAULT_BASE_URL: ${{ vars.KVAULT_BASE_URL }}
          KVAULT_API_TOKEN: ${{ secrets.KVAULT_API_TOKEN }}
          BLOG_MEDIA_STORAGE: r2
          BLOG_MEDIA_FOLDER: blog/health
          BLOG_MEDIA_DEDUPLICATE: 'false'
        run: node scripts/content-automation/media-doctor.mjs --smoke
      - name: Verify Telegram upload and valid public readback
        env:
          KVAULT_BASE_URL: ${{ vars.KVAULT_BASE_URL }}
          KVAULT_API_TOKEN: ${{ secrets.KVAULT_API_TOKEN }}
          BLOG_MEDIA_STORAGE: telegram
          BLOG_MEDIA_FOLDER: blog/health
          BLOG_MEDIA_DEDUPLICATE: 'false'
        run: node scripts/content-automation/media-doctor.mjs --smoke
