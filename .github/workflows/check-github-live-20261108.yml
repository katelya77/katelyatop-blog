name: One-time official GitHub showcase production check
on:
  push:
    branches: [master]
    paths: [".github/workflows/check-github-live-20261108.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare deployment metadata and actual GitHub HTML
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+'/pages/projects/katelyatop-blog/deployments?per_page=12';
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CF_API_TOKEN}});
          const j=await r.json();
          if(!r.ok||!j.success) throw new Error('Cloudflare deployment metadata query failed: HTTP '+r.status);
          const items=(j.result||[]).filter(x=>x.environment==='production').slice(0,8);
          console.log('PRODUCTION_DEPLOYMENTS',JSON.stringify(items.map(x=>({sha:x.deployment_trigger?.metadata?.commit_hash,status:x.latest_stage?.status,created:x.created_on,environment:x.environment})))));
          const page='https://blog.katelya.top/github/';
          const res=await fetch(page,{headers:{'User-Agent':'Katelya-GitHub-Page-Production-Check/1.0'},signal:AbortSignal.timeout(15000)});
          const html=await res.text();
          const hasTitle=html.includes('GitHub 贡献日历');
          const hasTotal=html.includes('3,009')||html.includes('3009');
          console.log('LIVE_HTTP',res.status,'TITLE',hasTitle,'OFFICIAL_TOTAL',hasTotal,'HTML_BYTES',html.length);
          if(res.status!==200||!hasTitle||!hasTotal)throw new Error('Public GitHub page still lacks official annual contribution data');
          console.log('GITHUB_FULL_CALENDAR_PUBLIC_PASS');
          NODE
